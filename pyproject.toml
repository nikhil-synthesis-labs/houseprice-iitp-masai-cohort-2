[project]
name = "houseprice-iitp-masai"
version = "0.1.0"
description = "House Price Predictor — Streamlit anchor app for AIM Session 13.1."
readme = "README.md"
requires-python = ">=3.11"

# BUG #5 — scikit-learn pin can be deliberately narrowed (e.g. ==1.0.2) when
# teaching Issue #5 ("the pin is too old; bump it"). For the live-deployed
# template we pin to a current floor (>=1.4) so Streamlit Cloud's Python 3.13
# can install prebuilt wheels. To restore the teaching bug, edit the next line
# back to a narrow / outdated pin and re-commit.
dependencies = [
    "streamlit>=1.30",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.0",
    "plotly>=6.7.0",
]

# Streamlit Cloud uses Poetry to install when it sees a pyproject.toml.
# Without this block, Poetry tries to `pip install .` the project itself
# and fails because there's no `houseprice_iitp_masai/` package directory
# (we ship only `app.py` at the root).
# `package-mode = false` tells Poetry: dependency management only.
# `uv` ignores [tool.poetry] entirely, so local `uv sync` is unaffected.
[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
